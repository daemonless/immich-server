icon: ':material-server:'
# Needs a database (tested in daemonless/immich): run the image's own CMD
# and expect it to get as far as looking up the database host.
cit:
  mode: command
  expect_exit: 1
  expect_output: "getaddrinfo (ENOTFOUND|EAI_AGAIN) database"

build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
    - tag: beta
      containerfile: Containerfile
      args:
        # Newest release, release candidates included: v3.3.0-rc.1 today, and
        # the same as latest once a stable release is the newest.
        UPSTREAM_URL: "https://api.github.com/repos/immich-app/immich/releases"
        UPSTREAM_JQ: "first(.[] | select(.draft | not)) | .tag_name"
