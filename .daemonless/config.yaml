icon: ':material-server:'
# Needs a database (tested in daemonless/immich): run the image's own CMD
# and expect it to get as far as looking up the database host.
cit:
  mode: command
  expect_exit: 1
  expect_output: "getaddrinfo (ENOTFOUND|EAI_AGAIN) database"

build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
      aliases: ["beta"]
